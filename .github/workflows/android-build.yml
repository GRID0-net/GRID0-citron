name: Citrosis Android APK
run-name: Citrosis Android · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Android source branch, tag or commit (the main branch is the desktop tree)'
        required: true
        default: codex/citrosis-android
        type: string

permissions:
  contents: read

concurrency:
  group: citrosis-android-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the separate Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source selection and record provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          marker = Path('citrosis-upstream.json')
          if not marker.is_file() or json.loads(marker.read_text()).get('project') != 'Citrosis Android':
              raise SystemExit('Select the Lemon-based Citrosis Android branch, not the desktop tree.')
          PY
          mkdir -p build-android
          git rev-parse HEAD > build-android/SOURCE_COMMIT.txt
          cp citrosis-upstream.json build-android/
          printf '### Android source\n\nCommit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools"; legacy tools is no longer published.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: citrosis-android-gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/gradle/libs.versions.toml') }}
          restore-keys: |
            citrosis-android-gradle-${{ runner.os }}-

      - name: Cache native dependency downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: citrosis-android-cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/**') }}
          restore-keys: |
            citrosis-android-cpm-${{ runner.os }}-

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools autoconf automake libtool pkg-config nasm yasm

      - name: Build arm64 mainline Release APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ./build-citrosis-android.sh --setup --jobs 2
          cd build-android
          sha256sum Citrosis-release.apk > SHA256SUMS
          printf '\n### APK SHA-256\n\n```\n%s\n```\n' "$(cat SHA256SUMS)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and source receipt
        uses: actions/upload-artifact@v4
        with:
          name: Citrosis-Android-arm64-${{ github.run_number }}
          path: |
            build-android/Citrosis-release.apk
            build-android/SHA256SUMS
            build-android/SOURCE_COMMIT.txt
            build-android/citrosis-upstream.json
          if-no-files-found: error
          retention-days: 30
